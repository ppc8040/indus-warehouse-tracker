<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Indus Warehouse &#8212; Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes toastIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes toastOut { from{opacity:1;transform:translateY(0)} to{opacity:0;transform:translateY(-8px)} }

    /* ── DARK MODE (default) ───────────────────────────────────── */
    :root, [data-theme="dark"] {
      --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3347;
      --text:#e2e8f0;--muted:#8892a4;--ok:#22c55e;--err:#ef4444;
      --warn:#f59e0b;--info:#60a5fa;--primary:#6366f1;--neg:#fca5a5;
      --sap:#a78bfa;
      --tag-ok-bg:#14532d;--tag-ok-txt:#86efac;
      --tag-err-bg:#7f1d1d;--tag-err-txt:#fca5a5;
      --tag-warn-bg:#78350f;--tag-warn-txt:#fde68a;
      --tag-info-bg:#1e3a5f;--tag-info-txt:#93c5fd;
      --tag-sap-bg:#4c1d95;--tag-sap-txt:#ddd6fe;
      --neg-row-bg:#2d0a0a;--neg-row-txt:var(--neg);
      --excess-row-bg:#2d1f00;--excess-row-txt:#fde68a;
      --neg-banner-bg:#2d0a0a;--neg-banner-th-bg:#3d0f0f;
      --neg-banner-th-txt:#f87171;--neg-banner-td-bg:#2d0a0a;
      --neg-banner-hover:#3d0f0f;--neg-banner-border:#7f1d1d;
      --recon-err-bg:#1e0d3a;--recon-err-border:#6d28d9;--recon-err-txt:#c4b5fd;
      --btn-green-bg:#166534;--btn-green-txt:#86efac;--btn-green-hover:#14532d;
      --btn-sap-bg:#4c1d95;--btn-sap-txt:#ddd6fe;--btn-sap-border:#6d28d9;--btn-sap-hover:#5b21b6;
      --chart-tick:#8892a4;--chart-grid:#2e3347;
      --toggle-bg:#22263a;--toggle-border:#2e3347;
      --filter-cust-border:#4c1d95;
      --conn-ok-border:#166534;--conn-err-border:#7f1d1d;
      /* cell selection */
      --cell-sel-bg:rgba(99,102,241,0.18);--cell-sel-border:#6366f1;
      --cell-hover-bg:rgba(99,102,241,0.07);
      /* shortcut modal */
      --modal-bg:#1a1d27;--modal-border:#2e3347;
    }

    /* ── LIGHT MODE ────────────────────────────────────────────── */
    [data-theme="light"] {
      --bg:#f4f6fb;--surface:#ffffff;--surface2:#eef0f7;--border:#d0d5e8;
      --text:#1a1d27;--muted:#5c6480;--ok:#16a34a;--err:#dc2626;
      --warn:#d97706;--info:#2563eb;--primary:#4f46e5;--neg:#b91c1c;
      --sap:#7c3aed;
      --tag-ok-bg:#dcfce7;--tag-ok-txt:#166534;
      --tag-err-bg:#fee2e2;--tag-err-txt:#991b1b;
      --tag-warn-bg:#fef3c7;--tag-warn-txt:#92400e;
      --tag-info-bg:#dbeafe;--tag-info-txt:#1e40af;
      --tag-sap-bg:#ede9fe;--tag-sap-txt:#5b21b6;
      --neg-row-bg:#fee2e2;--neg-row-txt:#991b1b;
      --excess-row-bg:#fefce8;--excess-row-txt:#854d0e;
      --neg-banner-bg:#fee2e2;--neg-banner-th-bg:#fecaca;
      --neg-banner-th-txt:#991b1b;--neg-banner-td-bg:#fee2e2;
      --neg-banner-hover:#fecaca;--neg-banner-border:#fca5a5;
      --recon-err-bg:#ede9fe;--recon-err-border:#8b5cf6;--recon-err-txt:#5b21b6;
      --btn-green-bg:#166534;--btn-green-txt:#f0fdf4;--btn-green-hover:#14532d;
      --btn-sap-bg:#5b21b6;--btn-sap-txt:#fff;--btn-sap-border:#7c3aed;--btn-sap-hover:#4c1d95;
      --chart-tick:#5c6480;--chart-grid:#d0d5e8;
      --toggle-bg:#eef0f7;--toggle-border:#d0d5e8;
      --filter-cust-border:#7c3aed;
      --conn-ok-border:#166534;--conn-err-border:#dc2626;
      --cell-sel-bg:rgba(79,70,229,0.12);--cell-sel-border:#4f46e5;
      --cell-hover-bg:rgba(79,70,229,0.05);
      --modal-bg:#ffffff;--modal-border:#d0d5e8;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;min-height:100vh;transition:background .2s,color .2s}
    .hdr{display:flex;align-items:center;justify-content:space-between;
         padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;transition:background .2s,border-color .2s}
    .hdr h1{font-size:15px;font-weight:600}
    .hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .conn{font-size:12px;font-weight:500;padding:4px
